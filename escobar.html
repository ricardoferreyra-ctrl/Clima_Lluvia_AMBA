<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precipitaciones - Belén de Escobar</title>
  <style>
    :root {
      --bg-main: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --color-real: #64748b;
      --color-cercano: #2563eb;
      --color-extendido: #7c3aed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 40px 16px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .city-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 10px 0;
    }

    .section-subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .badge-cercano { background-color: #dbeafe; color: #1e40af; }
    .badge-extendido { background-color: #f3e8ff; color: #6b21a8; }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
    }

    .fecha {
      font-size: 0.78rem;
      color: #374151;
      width: 46px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .bar-container {
      flex-grow: 1;
      background-color: #f3f4f6;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 10px;
    }

    .bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bar-historical { background-color: var(--color-real); }
    .bar-cercano { background-color: var(--color-cercano); }
    .bar-extendido { background-color: var(--color-extendido); opacity: 0.85; }

    .mm {
      font-size: 0.78rem;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      color: #374151;
    }

    .sin-lluvia { color: #d1d5db; font-weight: 400; }
    .divider { height: 1px; background-color: #f3f4f6; margin: 16px 0; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Belén de Escobar</h1>
      <p class="subtitle">Pronóstico y registro de precipitaciones</p>
    </header>

    <div id="card-escobar" class="city-card">Cargando datos...</div>
  </div>

  <script>
    function formatearFecha(cadenaFecha) {
      const [anio, mes, dia] = cadenaFecha.split('-');
      return `${dia}/${mes}`;
    }

    function generarBloqueFilas(items, tipo, maxLluvia) {
      return items.map(item => {
        const mm = tipo === 'historico' ? item.mm_reales : item.mm_estimados;
        const porcentaje = Math.min((mm / maxLluvia) * 100, 100);
        
        let claseBarra = 'bar-historical';
        if (tipo === 'cercano') claseBarra = 'bar-cercano';
        if (tipo === 'extendido') claseBarra = 'bar-extendido';

        return `
          <div class="row">
            <span class="fecha">${formatearFecha(item.fecha)}</span>
            <div class="bar-container">
              <div class="bar ${claseBarra}" style="width: ${porcentaje}%;"></div>
            </div>
            <span class="mm">${mm > 0 ? mm + ' <small>mm</small>' : '<span class="sin-lluvia">0 mm</span>'}</span>
          </div>
        `;
      }).join('');
    }

    async function cargarEscobar() {
      try {
        const res = await fetch('https://clima-lluvia-amba.onrender.com/api/lluvia-todas');
        const ciudades = await res.json();
        
        // Filtramos solo Escobar
        const escobar = ciudades.find(c => c.id === 'escobar');

        if (!escobar) throw new Error("No se encontró la ubicación");

        let maxLluvia = 5;
        escobar.historico.forEach(i => { if (i.mm_reales > maxLluvia) maxLluvia = i.mm_reales; });
        escobar.pronostico.forEach(i => { if (i.mm_estimados > maxLluvia) maxLluvia = i.mm_estimados; });

        const pronosticoCercano = escobar.pronostico.slice(0, 7);
        const pronosticoExtendido = escobar.pronostico.slice(7, 14);

        const contenedor = document.getElementById('card-escobar');
        contenedor.innerHTML = `
          <div class="section-header">
            <span class="section-subtitle">Últimos 5 días</span>
          </div>
          ${generarBloqueFilas(escobar.historico, 'historico', maxLluvia)}

          <div class="divider"></div>

          <div class="section-header">
            <span class="section-subtitle">Próximos 7 días</span>
            <span class="badge badge-cercano">Alta precisión</span>
          </div>
          ${generarBloqueFilas(pronosticoCercano, 'cercano', maxLluvia)}

          <div class="divider"></div>

          <div class="section-header">
            <span class="section-subtitle">Días 8 a 14</span>
            <span class="badge badge-extendido">Tendencia</span>
          </div>
          ${generarBloqueFilas(pronosticoExtendido, 'extendido', maxLluvia)}
        `;

      } catch (err) {
        console.error(err);
        document.getElementById('card-escobar').innerText = 'Error al cargar los datos de Escobar';
      }
    }

    cargarEscobar();
  </script>
</body>
</html>
