<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precipitaciones - AMBA y La Plata</title>
  <style>
    :root {
      --bg-main: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --color-real: #64748b;        /* Slate */
      --color-cercano: #2563eb;     /* Blue */
      --color-extendido: #7c3aed;   /* Purple / Indigo */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 40px 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: #111827;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Leyenda superior */
    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Grid principal */
    .columns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 960px) {
      .columns-grid {
        grid-template-columns: 1fr;
      }
    }

    .city-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .city-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    .city-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 20px 0;
      text-align: center;
      color: #111827;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px 0;
    }

    .section-subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin: 0;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .badge-cercano {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .badge-extendido {
      background-color: #f3e8ff;
      color: #6b21a8;
    }

    /* Filas y barras de progreso */
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
    }

    .row-highlight {
      background-color: #f8fafc;
      border-radius: 6px;
      padding: 2px 4px;
    }

    .fecha {
      font-size: 0.78rem;
      color: #374151;
      width: 46px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .bar-container {
      flex-grow: 1;
      background-color: #f3f4f6;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 10px;
    }

    .bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar-historical { background-color: var(--color-real); }
    .bar-cercano { background-color: var(--color-cercano); }
    .bar-extendido { 
      background-color: var(--color-extendido); 
      opacity: 0.85;
    }

    .mm {
      font-size: 0.78rem;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      color: #374151;
    }

    .mm-bold {
      font-weight: 700;
      color: #111827;
    }

    .sin-lluvia {
      color: #d1d5db;
      font-weight: 400;
    }

    .divider {
      height: 1px;
      background-color: #f3f4f6;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Precipitaciones en Buenos Aires</h1>
      <p class="subtitle">Análisis histórico y pronóstico extendido de milímetros acumulados</p>
      
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-real);"></div>
          <span>Pasado (Real)</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-cercano);"></div>
          <span>Días 1-7 (Alta precisión)</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-extendido);"></div>
          <span>Días 8-14 (Tendencia)</span>
        </div>
      </div>
    </header>

    <div id="grid-ciudades" class="columns-grid">Cargando datos...</div>
  </div>

  <script>
    function formatearFecha(cadenaFecha) {
      const [anio, mes, dia] = cadenaFecha.split('-');
      return `${dia}/${mes}`;
    }

    function generarBloqueFilas(items, tipo, maxLluvia) {
      return items.map(item => {
        const mm = tipo === 'historico' ? item.mm_reales : item.mm_estimados;
        const porcentaje = Math.min((mm / maxLluvia) * 100, 100);
        
        let claseBarra = 'bar-historical';
        if (tipo === 'cercano') claseBarra = 'bar-cercano';
        if (tipo === 'extendido') claseBarra = 'bar-extendido';

        const esLluviaRelevante = mm >= 5;
        const claseTexto = mm > 0 ? (esLluviaRelevante ? 'mm mm-bold' : 'mm') : 'mm sin-lluvia';
        const textoMM = mm > 0 ? `${mm} <small>mm</small>` : `0 mm`;

        return `
          <div class="row ${esLluviaRelevante ? 'row-highlight' : ''}">
            <span class="fecha">${formatearFecha(item.fecha)}</span>
            <div class="bar-container">
              <div class="bar ${claseBarra}" style="width: ${porcentaje}%;"></div>
            </div>
            <span class="${claseTexto}">${textoMM}</span>
          </div>
        `;
      }).join('');
    }

    async function cargarDatos() {
      try {
        const res = await fetch('https://clima-lluvia-amba.onrender.com/api/lluvia-todas');
        const ciudades = await res.json();

        let maxLluviaGlobal = 5;
        ciudades.forEach(c => {
          c.historico.forEach(i => { if (i.mm_reales > maxLluviaGlobal) maxLluviaGlobal = i.mm_reales; });
          c.pronostico.forEach(i => { if (i.mm_estimados > maxLluviaGlobal) maxLluviaGlobal = i.mm_estimados; });
        });

        const contenedor = document.getElementById('grid-ciudades');
        contenedor.innerHTML = ciudades.map(ciudad => {
          // Separar el pronóstico en los primeros 7 días y los 7 finales
          const pronosticoCercano = ciudad.pronostico.slice(0, 7);
          const pronosticoExtendido = ciudad.pronostico.slice(7, 14);

          return `
            <div class="city-card">
              <h2 class="city-title">${ciudad.nombre}</h2>
              
              <div class="section-header">
                <span class="section-subtitle">Últimos 5 días</span>
              </div>
              ${generarBloqueFilas(ciudad.historico, 'historico', maxLluviaGlobal)}

              <div class="divider"></div>

              <div class="section-header">
                <span class="section-subtitle">Próximos 7 días</span>
                <span class="badge badge-cercano">Alta precisión</span>
              </div>
              ${generarBloqueFilas(pronosticoCercano, 'cercano', maxLluviaGlobal)}

              <div class="divider"></div>

              <div class="section-header">
                <span class="section-subtitle">Días 8 a 14</span>
                <span class="badge badge-extendido">Tendencia</span>
              </div>
              ${generarBloqueFilas(pronosticoExtendido, 'extendido', maxLluviaGlobal)}
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        document.getElementById('grid-ciudades').innerText = 'Error al cargar los datos';
      }
    }

    cargarDatos();
  </script>
</body>
</html>
