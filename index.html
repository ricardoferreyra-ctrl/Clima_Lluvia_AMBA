<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precipitaciones - La Plata, CABA y Escobar</title>
  <style>
    :root {
      --bg-main: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --color-real: #64748b;        /* Slate */
      --color-estimado-pasado: #93c5fd; /* Light Blue */
      --color-cercano: #2563eb;     /* Blue */
      --color-extendido: #7c3aed;   /* Purple */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 40px 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .columns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 960px) {
      .columns-grid {
        grid-template-columns: 1fr;
      }
    }

    .city-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .city-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 20px 0;
      text-align: center;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px 0;
    }

    .section-subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .badge-cercano { background-color: #dbeafe; color: #1e40af; }
    .badge-extendido { background-color: #f3e8ff; color: #6b21a8; }

    /* Estilos para el Bloque Comparativo Histórico */
    .history-block {
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
    }

    .history-header {
      font-size: 0.78rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
    }

    .sub-row {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }

    .sub-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      width: 42px;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .bar-container-sm {
      flex-grow: 1;
      background-color: #e5e7eb;
      height: 5px;
      border-radius: 3px;
      overflow: hidden;
      margin: 0 8px;
    }

    .bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .bar-real { background-color: var(--color-real); }
    .bar-est-pasado { background-color: var(--color-estimado-pasado); }
    .bar-cercano { background-color: var(--color-cercano); }
    .bar-extendido { background-color: var(--color-extendido); opacity: 0.85; }

    /* Filas de pronóstico simple */
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
    }

    .fecha {
      font-size: 0.78rem;
      color: #374151;
      width: 46px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .bar-container {
      flex-grow: 1;
      background-color: #f3f4f6;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 10px;
    }

    .mm {
      font-size: 0.75rem;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      color: #374151;
    }

    .sin-lluvia { color: #d1d5db; font-weight: 400; }
    .divider { height: 1px; background-color: #f3f4f6; margin: 16px 0; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Precipitaciones en Buenos Aires</h1>
      <p class="subtitle">Análisis comparativo de precisión y pronóstico extendido</p>
      
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-real);"></div>
          <span>Medido (Real)</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-estimado-pasado);"></div>
          <span>Estimación Previa</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-cercano);"></div>
          <span>Próximos 7 días</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-extendido);"></div>
          <span>Días 8-14 (Tendencia)</span>
        </div>
      </div>
    </header>

    <div id="grid-ciudades" class="columns-grid">Cargando datos...</div>
  </div>

  <script>
    function formatearFecha(cadenaFecha) {
      const [anio, mes, dia] = cadenaFecha.split('-');
      return `${dia}/${mes}`;
    }

    // Renderiza el bloque histórico de 5 días con doble barra (Real vs Estimado)
    function generarHistoricoComparativo(items, maxLluvia) {
      return items.map(item => {
        const mmReal = item.mm_reales ?? 0;
        // Si no cuentas con estimado previo guardado, puedes simularlo para testing
        const mmEst = item.mm_estimados ?? mmReal; 

        const pctReal = Math.min((mmReal / maxLluvia) * 100, 100);
        const pctEst = Math.min((mmEst / maxLluvia) * 100, 100);

        return `
          <div class="history-block">
            <div class="history-header">${formatearFecha(item.fecha)}</div>
            
            <div class="sub-row">
              <span class="sub-label">Real</span>
              <div class="bar-container-sm">
                <div class="bar bar-real" style="width: ${pctReal}%;"></div>
              </div>
              <span class="mm">${mmReal > 0 ? mmReal + ' <small>mm</small>' : '<span class="sin-lluvia">0 mm</span>'}</span>
            </div>

            <div class="sub-row">
              <span class="sub-label">Est.</span>
              <div class="bar-container-sm">
                <div class="bar bar-est-pasado" style="width: ${pctEst}%;"></div>
              </div>
              <span class="mm">${mmEst > 0 ? mmEst + ' <small>mm</small>' : '<span class="sin-lluvia">0 mm</span>'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Renderiza los bloques de pronóstico estándar (1 sola barra)
    function generarBloquePronostico(items, tipo, maxLluvia) {
      return items.map(item => {
        const mm = item.mm_estimados;
        const porcentaje = Math.min((mm / maxLluvia) * 100, 100);
        const claseBarra = tipo === 'cercano' ? 'bar-cercano' : 'bar-extendido';

        return `
          <div class="row">
            <span class="fecha">${formatearFecha(item.fecha)}</span>
            <div class="bar-container">
              <div class="bar ${claseBarra}" style="width: ${porcentaje}%;"></div>
            </div>
            <span class="mm">${mm > 0 ? mm + ' <small>mm</small>' : '<span class="sin-lluvia">0 mm</span>'}</span>
          </div>
        `;
      }).join('');
    }

    async function cargarDatos() {
      try {
        const res = await fetch('https://clima-lluvia-amba.onrender.com/api/lluvia-todas');
        const ciudades = await res.json();

        let maxLluviaGlobal = 5;
        ciudades.forEach(c => {
          c.historico.forEach(i => { 
            if (i.mm_reales > maxLluviaGlobal) maxLluviaGlobal = i.mm_reales; 
          });
          c.pronostico.forEach(i => { 
            if (i.mm_estimados > maxLluviaGlobal) maxLluviaGlobal = i.mm_estimados; 
          });
        });

        const contenedor = document.getElementById('grid-ciudades');
        contenedor.innerHTML = ciudades.map(ciudad => {
          const pronosticoCercano = ciudad.pronostico.slice(0, 7);
          const pronosticoExtendido = ciudad.pronostico.slice(7, 14);

          return `
            <div class="city-card">
              <h2 class="city-title">${ciudad.nombre}</h2>
              
              <div class="section-header">
                <span class="section-subtitle">Últimos 5 días (Comparativa)</span>
              </div>
              ${generarHistoricoComparativo(ciudad.historico, maxLluviaGlobal)}

              <div class="divider"></div>

              <div class="section-header">
                <span class="section-subtitle">Próximos 7 días</span>
                <span class="badge badge-cercano">Alta precisión</span>
              </div>
              ${generarBloquePronostico(pronosticoCercano, 'cercano', maxLluviaGlobal)}

              <div class="divider"></div>

              <div class="section-header">
                <span class="section-subtitle">Días 8 a 14</span>
                <span class="badge badge-extendido">Tendencia</span>
              </div>
              ${generarBloquePronostico(pronosticoExtendido, 'extendido', maxLluviaGlobal)}
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        document.getElementById('grid-ciudades').innerText = 'Error al cargar los datos';
      }
    }

    cargarDatos();
  </script>
</body>
</html>
