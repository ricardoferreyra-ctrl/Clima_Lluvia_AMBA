<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precipitaciones - La Plata, CABA y Escobar</title>
  <style>
    :root {
      --bg-main: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --color-real: #64748b;        /* Slate */
      --color-cercano: #2563eb;     /* Blue */
      --color-extendido: #7c3aed;   /* Purple */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 40px 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .columns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 960px) {
      .columns-grid {
        grid-template-columns: 1fr;
      }
    }

    .city-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .city-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 20px 0;
      text-align: center;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px 0;
    }

    .section-subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .badge-cercano { background-color: #dbeafe; color: #1e40af; }
    .badge-extendido { background-color: #f3e8ff; color: #6b21a8; }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
    }

    .fecha {
      font-size: 0.78rem;
      color: #374151;
      width: 46px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .bar-container {
      flex-grow: 1;
      background-color: #f3f4f6;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 10px;
    }

    .bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bar-historical { background-color: var(--color-real); }
    .bar-cercano { background-color: var(--color-cercano); }
    .bar-extendido { background-color: var(--color-extendido); opacity: 0.85; }

    .mm {
      font-size: 0.78rem;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      color: #374151;
    }

    .sin-lluvia { color: #d1d5db; font-weight: 400; }
    .divider { height: 1px; background-color: #f3f4f6; margin: 16px 0; }

    /* Estilos para el Widget del Río Luján (Escobar) */
    .rio-widget {
      margin-top: 16px;
      padding: 14px;
      background-color: #f0f9ff;
      border-radius: 10px;
      border: 1px solid #bae6fd;
    }

    .rio-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0369a1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rio-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rio-val {
      font-size: 1.3rem;
      font-weight: 800;
      color: #111827;
      margin-right: 10px;
    }

    .rio-subtitle {
      font-size: 0.75rem;
      color: #075985;
      font-weight: 500;
    }

    .badge-rio {
      background-color: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    
    .badge-warning-rio {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    
    .badge-danger-rio {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Precipitaciones en Buenos Aires</h1>
      <p class="subtitle">Análisis histórico y pronóstico extendido de milímetros acumulados</p>
      
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-real);"></div>
          <span>Pasado (Real)</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-cercano);"></div>
          <span>Próximos 7 días</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background-color: var(--color-extendido);"></div>
          <span>Días 8-14 (Tendencia)</span>
        </div>
      </div>
    </header>

    <div id="grid-ciudades" class="columns-grid">Cargando datos...</div>
  </div>

  <script>
    function formatearFecha(cadenaFecha) {
      const [anio, mes, dia] = cadenaFecha.split('-');
      return `${dia}/${mes}`;
    }

    function generarBloqueFilas(items, tipo, maxLluvia) {
      return items.map(item => {
        const mm = tipo === 'historico' ? item.mm_reales : item.mm_estimados;
        const porcentaje = Math.min((mm / maxLluvia) * 100, 100);
        
        let claseBarra = 'bar-historical';
        if (tipo === 'cercano') claseBarra = 'bar-cercano';
        if (tipo === 'extendido') claseBarra = 'bar-extendido';

        return `
          <div class="row">
            <span class="fecha">${formatearFecha(item.fecha)}</span>
            <div class="bar-container">
              <div class="bar ${claseBarra}" style="width: ${porcentaje}%;"></div>
            </div>
            <span class="mm">${mm > 0 ? mm + ' <small>mm</small>' : '<span class="sin-lluvia">0 mm</span>'}</span>
          </div>
        `;
      }).join('');
    }

    async function cargarDatosRio() {
      try {
        const resRio = await fetch('https://clima-lluvia-amba.onrender.com/api/rio-escobar');
        const pronosticoRio = await resRio.json();
        
        const content = document.getElementById('rio-escobar-content');
        if (!content || !pronosticoRio || pronosticoRio.length === 0) return;

        const picoMax = pronosticoRio.reduce((max, p) => p.nivelMetros > max.nivelMetros ? p : max, pronosticoRio[0]);
        
        let badgeClass = 'badge badge-rio';
        let statusText = 'Normal';
        
        if (picoMax.nivelMetros >= 2.20) {
          badgeClass = 'badge badge-warning-rio';
          statusText = 'Alerta';
        }
        if (picoMax.nivelMetros >= 2.50) {
          badgeClass = 'badge badge-danger-rio';
          statusText = 'Evacuación';
        }

        const datePico = new Date(picoMax.fechaHora);
        const fechaStr = `${datePico.getDate()}/${datePico.getMonth()+1}`;

        content.innerHTML = `
          <div class="rio-title">
            <span>Río Luján (INA)</span>
            <span class="${badgeClass}">${statusText}</span>
          </div>
          <div class="rio-status">
            <span class="rio-val">${picoMax.nivelMetros.toFixed(2)} m</span>
            <span class="rio-subtitle">Max. prono. (${fechaStr})</span>
          </div>
        `;

      } catch (err) {
        console.error(err);
        const content = document.getElementById('rio-escobar-content');
        if (content) {
          content.innerText = 'Error al cargar nivel del río';
          content.style.backgroundColor = '#fee2e2';
        }
      }
    }

    async function cargarDatos() {
      try {
        const res = await fetch('https://clima-lluvia-amba.onrender.com/api/lluvia-todas');
        const ciudades = await res.json();

        let maxLluviaGlobal = 5;
        ciudades.forEach(c => {
          c.historico.forEach(i => { if (i.mm_reales > maxLluviaGlobal) maxLluviaGlobal = i.mm_reales; });
          c.pronostico.forEach(i => { if (i.mm_estimados > maxLluviaGlobal) maxLluviaGlobal = i.mm_estimados; });
        });

        const contenedor = document.getElementById('grid-ciudades');
        contenedor.innerHTML = ciudades.map(ciudad => {
          const pronosticoCercano = ciudad.pronostico.slice(0, 7);
          const pronosticoExtendido = ciudad.pronostico.slice(7, 14);

          let htmlCard = `
            <div class="city-card">
              <h2 class="city-title">${ciudad.nombre}</h2>
              
              <div class="section-header">
                <span class="section-subtitle">Últimos 5 días</span>
              </div>
              ${generarBloqueFilas(ciudad.historico, 'historico', maxLluviaGlobal)}

              <div class="divider"></div>

              <div class="section-header">
                <span class="section-subtitle">Próximos 7 días</span>
                <span class="badge badge-cercano">Alta precisión</span>
              </div>
              ${generarBloqueFilas(pronosticoCercano, 'cercano', maxLluviaGlobal)}

              <div class="divider"></div>

              <div class="section-header">
                <span class="section-subtitle">Días 8 a 14</span>
                <span class="badge badge-extendido">Tendencia</span>
              </div>
              ${generarBloqueFilas(pronosticoExtendido, 'extendido', maxLluviaGlobal)}
          `;

          if (ciudad.id === 'escobar') {
            htmlCard += `
              <div class="divider"></div>
              <div class="rio-widget" id="rio-escobar-content">
                Cargando nivel del río Luján...
              </div>
            `;
          }

          htmlCard += `</div>`;
          return htmlCard;
        }).join('');

        await cargarDatosRio();

      } catch (err) {
        console.error(err);
        document.getElementById('grid-ciudades').innerText = 'Error al cargar los datos';
      }
    }

    cargarDatos();
  </script>
</body>
</html>
